<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Destructuring Object</title>
  </head>
  <body>
    <script>
      let obj = {
        name: "Ayaz",
        age: 20,
        city: "Wah Cantt",
      };
      let { name, age: a, city } = obj;
      console.log(name);
      console.log(a);
      console.log(city);
    </script>
  </body>
</html>
