  </head>
  <body>

    <form id="myForm">
      Title <input type="text" id="titleText" /> <br />
      Body <input type="text" id="bodyText" /><br />
      UserID <input type="text" id="userId" /><br />
      <input type="submit" id="saveForm" />
    </form>

    <script>

      document.getElementById("saveForm").addEventListener("click", (e) => {
        e.preventDefault();

        let obj = {
          title: document.getElementById("titleText").value,
          body: document.getElementById("bodyText").value,
          userId: document.getElementById("userId").value,
        };

        fetch("https://jsonplaceholder.typicode.com/posts", {
          method: "POST",
          body: JSON.stringify(obj),
          headers: {
            "Content-type": "application/json; charset=UTF-8",
          },
        })
          .then((response) => response.json())
          .then((json) => console.log(json))
          .catch((error) => document.write(error.message));
      });

    </script>
    
  </body>
</html>
