<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>filter</title>
    <script>
        let ages = [43, 89, 12, 32, 17];
        let result = ages.filter(checkAdult);
        document.write(result);
        function checkAdult(age){
            return age >= 18;
        }
    </script>
</head>

</body>
