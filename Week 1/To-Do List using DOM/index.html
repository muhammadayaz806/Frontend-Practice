<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        #titleTask {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        #titleTask:focus {
            outline: none;
            border-color: #667eea;
        }

        #saveForm {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: background 0.3s;
        }

        #saveForm:hover {
            background: #764ba2;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 5px;
            text-align: center;
        }

        .stat-item {
            font-size: 0.9em;
            color: #666;
        }

        .stat-number {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
        }

        #todoContainer {
            max-height: 500px;
            overflow-y: auto;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: #f9f9f9;
            border-left: 4px solid #667eea;
            margin-bottom: 10px;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .todo-item:hover {
            background: #f0f0f0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .todo-item.completed {
            opacity: 0.7;
            border-left-color: #4caf50;
        }

        .todo-item.completed .todo-title {
            text-decoration: line-through;
            color: #999;
        }

        .todo-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .todo-title {
            flex: 1;
            font-size: 1em;
            color: #333;
            word-break: break-word;
        }

        .todo-delete {
            padding: 8px 12px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.3s;
        }

        .todo-delete:hover {
            background: #ff5252;
        }

        .empty-message {
            text-align: center;
            color: #999;
            padding: 40px 20px;
            font-size: 1.1em;
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>My To-Do List</h1>

        <div class="error-message" id="errorMessage"></div>

        <form id="myform" class="form-group">
            <input 
                type="text" 
                id="titleTask" 
                placeholder="Add a new task..."
                required
            >
            <button type="submit" id="saveForm">Add Task</button>
        </form>

        <div class="stats" id="stats">
            <div class="stat-item">
                Total: <div class="stat-number" id="totalCount">0</div>
            </div>
            <div class="stat-item">
                Completed: <div class="stat-number" id="completedCount">0</div>
            </div>
            <div class="stat-item">
                Remaining: <div class="stat-number" id="remainingCount">0</div>
            </div>
        </div>

        <div id="todoContainer" class="empty-message">Loading todos...</div>
    </div>

    <script>
        // State management
        let todos = [];
        let nextId = 1;

        // DOM Elements
        const form = document.getElementById('myform');
        const titleInput = document.getElementById('titleTask');
        const container = document.getElementById('todoContainer');
        const errorMessage = document.getElementById('errorMessage');
        const totalCount = document.getElementById('totalCount');
        const completedCount = document.getElementById('completedCount');
        const remainingCount = document.getElementById('remainingCount');

        // Load todos from JSON file
        function loadTodos() {
            fetch('todos.json')
                .then((response) => response.json())
                .then((data) => {
                    todos = data;
                    nextId = Math.max(...todos.map(t => t.id)) + 1 || 1;
                    renderTodos();
                })
                .catch((error) => {
                    showError(`Failed to load todos: ${error.message}`);
                    console.error(error);
                });
        }

        // Render all todos to the DOM
        function renderTodos() {
            container.innerHTML = '';

            if (todos.length === 0) {
                container.innerHTML = '<div class="empty-message">No tasks yet. Add one to get started!</div>';
                updateStats();
                return;
            }

            todos.forEach((todo) => {
                const todoItem = document.createElement('div');
                todoItem.className = `todo-item ${todo.completed ? 'completed' : ''}`;
                todoItem.innerHTML = `
                    <input 
                        type="checkbox" 
                        class="todo-checkbox" 
                        ${todo.completed ? 'checked' : ''}
                        data-id="${todo.id}"
                    >
                    <span class="todo-title">${escapeHtml(todo.title)}</span>
                    <button class="todo-delete" data-id="${todo.id}">Delete</button>
                `;

                // Event listeners for this todo
                todoItem.querySelector('.todo-checkbox').addEventListener('change', (e) => {
                    toggleTodo(todo.id);
                });

                todoItem.querySelector('.todo-delete').addEventListener('click', (e) => {
                    deleteTodo(todo.id);
                });

                container.appendChild(todoItem);
            });

            updateStats();
        }

        // Toggle todo completion status
        function toggleTodo(id) {
            const todo = todos.find(t => t.id === id);
            if (todo) {
                todo.completed = !todo.completed;
                renderTodos();
            }
        }

        // Delete a todo
        function deleteTodo(id) {
            todos = todos.filter(t => t.id !== id);
            renderTodos();
        }

        // Add new todo
        function addTodo(title) {
            if (title.trim() === '') {
                showError('Please enter a task title');
                return;
            }

            const newTodo = {
                id: nextId++,
                title: title.trim(),
                completed: false
            };

            todos.push(newTodo);
            titleInput.value = '';
            renderTodos();
            hideError();
        }

        // Update statistics
        function updateStats() {
            const total = todos.length;
            const completed = todos.filter(t => t.completed).length;
            const remaining = total - completed;

            totalCount.textContent = total;
            completedCount.textContent = completed;
            remainingCount.textContent = remaining;
        }

        // Show error message
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        // Hide error message
        function hideError() {
            errorMessage.style.display = 'none';
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Event listeners
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            addTodo(titleInput.value);
        });

        // Initial load
        loadTodos();
    </script>
</body>
</html>
